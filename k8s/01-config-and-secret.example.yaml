# Template only. Populate values via kubectl create secret or SealedSecrets/ExternalSecrets.
# Never commit real credentials or private keys.
apiVersion: v1
kind: Secret
metadata:
  name: opensourcehq-secrets
  namespace: nst-events
type: Opaque
stringData:
  DATABASE_URL: "postgresql://opensourcehq_app:REPLACE_DB_PASSWORD@opensourcehq-postgres.nst-events.svc.cluster.local:5432/opensourcehq?schema=public&connection_limit=15"
  POSTGRES_DB: "opensourcehq"
  POSTGRES_USER: "opensourcehq_app"
  POSTGRES_PASSWORD: "REPLACE_DB_PASSWORD"
  AUTH_SECRET: "REPLACE_WITH_32_PLUS_CHAR_RANDOM_SECRET"
  APP_ENCRYPTION_KEY: "REPLACE_WITH_32_PLUS_CHAR_RANDOM_KEY"
  CRON_SECRET: "REPLACE_WITH_32_PLUS_CHAR_RANDOM_CRON_SECRET"
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_APP_ID: ""
  GITHUB_APP_SLUG: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITHUB_WEBHOOK_SECRET: ""
  EMAIL_FROM: "notifications@org.nstsdc.org"
  EMAIL_PROVIDER_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensourcehq-config
  namespace: nst-events
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_URL: "https://org.nstsdc.org"
  GITHUB_CALLBACK_URL: "https://org.nstsdc.org/api/auth/github/callback"

