apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensourcehq-ingress
  namespace: nst-events
spec:
  ingressClassName: traefik
  rules:
    - host: org.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensourcehq-app
                port:
                  number: 80
