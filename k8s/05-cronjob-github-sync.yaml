apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensourcehq-github-sync
  namespace: nst-events
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: github-sync-trigger
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: opensourcehq-secrets
                      key: CRON_SECRET
              command:
                - sh
                - -c
                - >
                  curl -fsS --max-time 60 -H "Authorization: Bearer ${CRON_SECRET}"
                  http://opensourcehq-app.nst-events.svc.cluster.local/api/cron/github-sync
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
