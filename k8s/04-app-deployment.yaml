apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensourcehq-app
  namespace: nst-events
  labels:
    app: opensourcehq-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: opensourcehq-app
  template:
    metadata:
      labels:
        app: opensourcehq-app
    spec:
      restartPolicy: Always
      # Uncomment imagePullSecrets if the GHCR package is private:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: opensourcehq
          image: ghcr.io/REPLACE_GITHUB_OWNER/REPLACE_REPO_NAME:REPLACE_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: opensourcehq-config
            - secretRef:
                name: opensourcehq-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: opensourcehq-app
  namespace: nst-events
  labels:
    app: opensourcehq-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: opensourcehq-app
