<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Chevron & Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="120" y1="140" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Emerald/Cyan Gradient -->
    <linearGradient id="accentGrad" x1="280" y1="310" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Radial Soft Glow Behind Icon -->
    <radialGradient id="glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner Subtle Ring -->
  <rect x="28" y="28" width="456" height="456" rx="100" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Terminal Chevron ">" -->
  <path d="M150 170 L250 256 L150 342" stroke="url(#glyphGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Code/Branch Node Underscore and Dot -->
  <line x1="284" y1="342" x2="368" y2="342" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" />

  <!-- Active Fellowship / Branch Pulse Indicator -->
  <circle cx="350" cy="190" r="24" fill="#38bdf8" />
  <circle cx="350" cy="190" r="36" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4" />
</svg>

